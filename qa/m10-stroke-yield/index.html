<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Illustro — 確定前のタッチ応答検査</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:740px;margin:24px auto;padding:0 16px;background:#f1f4f9;color:#24304a}main{background:white;border:1px solid #dbe2ef;border-radius:16px;padding:22px}.go{display:inline-block;padding:12px 20px;background:#325dcd;color:#fff;text-decoration:none;border-radius:10px}li{margin:8px 0}</style></head><body><main><h1>正式反映前のタッチ数を調べる修正版</h1><p>線の履歴を作るときの計算を、小さな区切りに分ける処理も追加しました。描画用GPUと画像反映の処理だけでなく、線の区画計算でも指の入力を受け付ける機会を作ります。</p><p><a class="go" href="./app/?touchProbe=1&amp;captureTouch=isolated#home">確認版を開く</a></p><ol><li>太いGペンで長めの線を描き、ペンを離します。</li><li>独立したタッチ判定面に指を1本置き、「線を作品に反映しました」が出る<strong>前</strong>に1へ変わるか確認します。</li><li>2本目を置いて2へ変わるか確認します。</li><li>描画へ戻るボタンで検査面を閉じます。</li></ol><p>今回も正式確定の通知後に数字が変わるだけでは不合格です。Android実機で解決したとは未確認です。</p><p><a href="https://github.com/totoro0419/illustro/pull/60">PR #60</a></p></main></body></html>
