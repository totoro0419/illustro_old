<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>独立した指入力確認</title>
<style>html,body{margin:0;height:100%;touch-action:none;overscroll-behavior:none;font:16px/1.6 system-ui,sans-serif;background:#f1f4f9;color:#25344e}main{height:100%;display:flex;flex-direction:column;padding:16px;gap:12px}#pad{flex:1;min-height:210px;border:3px dashed #6484d5;border-radius:16px;background:white;position:relative;touch-action:none;overflow:hidden}canvas{position:absolute;width:100%;height:100%;touch-action:none}#counter{font-size:42px;font-variant-numeric:tabular-nums;font-weight:800;text-align:center;background:white;border-radius:12px;padding:8px}#log{font:12px/1.5 monospace;background:white;padding:8px;border-radius:9px}p{margin:0}a{color:#315dc7}</style></head><body><main><h2 style="margin:0;font-size:20px">描画処理を使わない対照実験</h2><p>白い面で指を動かして線を引き、離した直後に指を1本・2本と置いてください。GPUやIllustroは一切読み込みません。</p><div id="pad"><canvas id="ink"></canvas></div><div id="counter">指の本数：0</div><output id="log">入力待ち</output><p><a href="./">4つの試験へ戻る</a></p></main>
<script>
const canvas=document.getElementById('ink'),ctx=canvas.getContext('2d'),c=document.getElementById('counter'),log=document.getElementById('log'),pad=document.getElementById('pad');
let pointers=new Set(),touchSeen=false,number=0,last='なし';
function resize(){const r=pad.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineWidth=13;ctx.lineCap='round';ctx.strokeStyle='#3b62cb';}
resize();addEventListener('resize',resize);
function render(){c.textContent='指の本数：'+number;log.textContent='最後: '+last+' / '+Math.round(performance.now())+'ms';}
for(const type of ['touchstart','touchend','touchcancel','touchmove'])pad.addEventListener(type,e=>{touchSeen=true;number=e.touches.length;last=type;if(e.cancelable)e.preventDefault();render();},{capture:true,passive:false});
for(const type of ['pointerdown','pointermove','pointerup','pointercancel'])pad.addEventListener(type,e=>{
 if(e.pointerType!=='touch')return;
 if(type==='pointerdown'){pointers.add(e.pointerId);ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);}
 if(type==='pointermove'&&pointers.has(e.pointerId)){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}
 if(type==='pointerup'||type==='pointercancel')pointers.delete(e.pointerId);
 if(!touchSeen)number=pointers.size;
 last=type;render();
},{capture:true});
render();
</script></body></html>
