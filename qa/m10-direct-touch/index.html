<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Illustro — 指が1本・2本と認識されるか</title>
<style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#24334b;background:#f1f4f9}
*{box-sizing:border-box}
body{margin:0 auto;max-width:760px;padding:18px 16px 32px}
main{background:white;padding:18px;border-radius:18px;border:1px solid #dce3ed}
h1{font-size:1.25rem;margin:0 0 10px}
p{line-height:1.7}
.contact{border:3px dashed #4a70db;background:#eaf0ff;border-radius:18px;min-height:38vh;touch-action:none;user-select:none;overscroll-behavior:contain;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0}
.contact strong{font-size:clamp(92px,21vw,150px);font-variant-numeric:tabular-nums;line-height:1.15;color:#1846bb}
.contact span{font-size:16px;font-weight:650}
.status{white-space:pre-line;font:13px/1.7 monospace;padding:12px;background:#f6f8ff;border-radius:10px;margin-top:12px}
a{color:#305cc3}
.action{display:block;margin:16px 0;padding:13px;background:#355fc9;color:white;text-decoration:none;text-align:center;border-radius:12px;font-weight:700}
.note{font-size:13px;color:#505e74}
</style></head>
<body><main>
<h1>指の本数だけを確認</h1>
<p><strong>青い枠の中</strong>に指を1本、次に2本置いてください。作品やGPUを動かさない、独立した検査です。</p>
<div id="pad" class="contact" aria-label="指の認識を確認する青い枠"><span>今触れている指の本数</span><strong id="count">0</strong><span>ここに指を置く</span></div>
<output class="status" id="status" aria-live="off">準備完了</output>
<a class="action" href="./app/?touchProbe=1&amp;captureTouch=1#home">Illustro内でも指の本数を確認する</a>
<p class="note">アプリ内では最初に「判定専用の透明な面」がキャンバス上に出ます。指の本数を調べる間は描画できません。「描画に戻す」を押すと元のキャンバスに戻ります。キャンバスやブラシ本体の操作方法は変更していません。</p>
<p class="note">検査コード: <a href="https://github.com/totoro0419/illustro/pull/57">PR #57</a></p>
</main>
<script>
(()=>{
 const pad=document.getElementById('pad'),counter=document.getElementById('count'),status=document.getElementById('status');
 let seenTouch=false,touch=0,starts=0,move=0,end=0,pointerStarts=0;
 const pointers=new Set(),handled=new WeakSet();
 function update(last){
  const total=seenTouch?touch:pointers.size;
  counter.textContent=String(total);
  status.textContent='Touch方式: '+(seenTouch?'受信済み':'未受信／Pointerから判定')+
   '\nTouch実数: '+touch+' / Pointer実数: '+pointers.size+
   '\n指を置いた: '+starts+' / 指を動かした: '+move+
   '\n指を離した: '+end+' / Pointer開始: '+pointerStarts+
   '\n最後の入力: '+last;
 }
 for(const type of ['touchstart','touchmove','touchend','touchcancel']){
  pad.addEventListener(type,e=>{
   if(e.cancelable)e.preventDefault();
   if(handled.has(e))return;handled.add(e);
   seenTouch=true;touch=e.touches.length;
   if(type==='touchstart')starts+=e.changedTouches.length;
   if(type==='touchmove')move++;
   if(type==='touchend'||type==='touchcancel')end+=e.changedTouches.length;
   update(type);
  },{passive:false});
 }
 for(const type of ['pointerdown','pointermove','pointerup','pointercancel','lostpointercapture']){
  pad.addEventListener(type,e=>{
   if(e.pointerType!=='touch')return;
   if(type==='pointerdown'){
    pointers.add(e.pointerId);pointerStarts++;
    try{pad.setPointerCapture(e.pointerId)}catch{}
   }else if(type!=='pointermove')pointers.delete(e.pointerId);
   update(type);
  });
 }
 update('待機中');
})();
</script></body></html>
