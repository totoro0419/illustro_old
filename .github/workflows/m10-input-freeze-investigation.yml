name: M10 Input Freeze Investigation
on:
  push:
    branches: ['investigate/M10-touch-main-thread-2026-10-25']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      RT_PLAYWRIGHT_PATH: /tmp/m10-input-test/node_modules/playwright
      RT_PNG_PATH: /tmp/m10-input-test/node_modules/pngjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate original brush/core and editor TypeScript
        run: |
          npm run brush:build
          npm run prep:check
          npm run core:check
          npm run brush:regression
          npm --workspace @illustro/editor exec -- vitest run
          npm --workspace @illustro/editor exec -- tsc --noEmit
          VITE_COMMIT_SHA="$GITHUB_SHA" npm --workspace @illustro/editor exec -- vite build --base=./
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/m10-input-test playwright@1.56.1 pngjs@7.0.0 --no-audit --no-fund
          /tmp/m10-input-test/node_modules/.bin/playwright install --with-deps chromium
      - name: CPU profile actual thick 4000px stroke, touch count and UI tasks
        run: TOUCH_TRACE_EVIDENCE=/tmp/m10-input-freeze/report.json node scripts/m10-input-freeze-investigation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m10-input-freeze-evidence
          path: /tmp/m10-input-freeze/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: m10-input-freeze-app
          path: apps/editor/dist/
  publish:
    needs: investigate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: m10-input-freeze-app
          path: site/qa/m10-input-freeze/app
      - name: Publish independent diagnostic preview
        run: |
          cp qa/m10-input-freeze/index.html site/qa/m10-input-freeze/index.html
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/m10-input-freeze
          test -z "$(git diff --cached --name-only | sed '/^qa\/m10-input-freeze\//d')"
          git diff --cached --quiet || git commit -m "qa: input freeze investigation $GITHUB_SHA"
          git pull --rebase origin gh-pages
          git push origin HEAD:gh-pages
